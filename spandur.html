<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandføringsberegner</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-bottom: 4px;
        }

        /* Fjerner pile i volumenfeltet */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"], textarea {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            height: 42px;
            resize: none; /* Fjerner "håndtaget" i bunden af bemærkningsfeltet */
            font-family: inherit;
            overflow: hidden;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        .main-btn {
            padding: 18px;
            border-radius: 10px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        .start-state { background-color: #4CAF50; color: white; }
        .stop-state { background-color: #f44336; color: white; }
        
        .stats-box {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .stat-value { font-weight: bold; color: #fff; }
        
        .info-box {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #333;
        }

        .guidance-text {
            display: block;
            color: #ffb74d;
            font-size: 0.8rem;
            padding: 8px;
            background-color: rgba(255, 183, 77, 0.1);
            border-radius: 4px;
            margin-bottom: 5px;
        }

        #reasonDisplay {
            display: block;
            color: #a0a0a0;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th { text-align: left; color: #a0a0a0; font-weight: normal; padding-bottom: 8px; }
        td { padding: 10px 0; border-top: 1px solid #333; }
        .delete-btn { color: #ff5252; background: none; border: none; cursor: pointer; font-size: 0.8rem; }

        .reset-btn {
            background: none;
            border: 1px solid #444;
            color: #a0a0a0;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-row">
            <div class="input-group">
                <label for="volume">Volumen (L)</label>
                <input type="number" id="volume" placeholder="Liter" step="0.1">
            </div>
            <div class="input-group">
                <label for="notes">Bemærkninger</label>
                <textarea id="notes"></textarea>
            </div>
        </div>

        <div class="timer-display" id="timerDisplay">0.00</div>

        <button id="mainBtn" class="main-btn start-state" onclick="toggleTimer()">Start</button>
        
        <div id="guidanceContainer" style="display: none;">
            <span id="guidanceText" class="guidance-text"></span>
        </div>

        <div class="stats-box">
            <div class="stat-row">
                <span>Gennemsnit:</span>
                <span class="stat-value" id="meanDisplay">- L/s</span>
            </div>
            <div class="stat-row">
                <span>Std. afvigelse:</span>
                <span class="stat-value" id="sdDisplay">-</span>
            </div>
            <div class="stat-row">
                <span>CV:</span>
                <span class="stat-value" id="cvDisplay">-</span>
            </div>
            <div class="info-box">
                <div class="stat-row">
                    <span>Vurdering:</span>
                    <span class="stat-value" id="statusText">-</span>
                </div>
                <span id="reasonDisplay">Klar til måling</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tid (s)</th>
                    <th>L/s</th>
                    <th style="text-align: right;">Valg</th>
                </tr>
            </thead>
            <tbody id="resultsTable"></tbody>
        </table>

        <button class="reset-btn" onclick="resetAll()">Nulstil målinger og tekst</button>
    </div>

    <script>
        let measurements = [];
        let startTime = null;
        let isRunning = false;
        let timerInterval = null;

        const mainBtn = document.getElementById('mainBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const volumeInput = document.getElementById('volume');
        const resultsTable = document.getElementById('resultsTable');
        const meanDisplay = document.getElementById('meanDisplay');
        const sdDisplay = document.getElementById('sdDisplay');
        const cvDisplay = document.getElementById('cvDisplay');
        const statusText = document.getElementById('statusText');
        const reasonDisplay = document.getElementById('reasonDisplay');
        const guidanceContainer = document.getElementById('guidanceContainer');
        const guidanceText = document.getElementById('guidanceText');
        const notesArea = document.getElementById('notes');

        function toggleTimer() {
            const vol = parseFloat(volumeInput.value);
            
            if (isNaN(vol) || vol <= 0) {
                alert("Indtast volumen før start.");
                return;
            }

            if (!isRunning) {
                startTime = Date.now();
                isRunning = true;
                mainBtn.textContent = "Stop";
                mainBtn.className = "main-btn stop-state";
                
                timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    timerDisplay.textContent = elapsed.toFixed(2);
                }, 10);
            } else {
                clearInterval(timerInterval);
                const durationSeconds = (Date.now() - startTime) / 1000;
                const flow = vol / durationSeconds;
                
                measurements.push({ time: durationSeconds, flow: flow });
                
                isRunning = false;
                mainBtn.textContent = "Start";
                mainBtn.className = "main-btn start-state";
                timerDisplay.textContent = durationSeconds.toFixed(2);
                updateUI();
            }
        }

        function calculateStats() {
            if (measurements.length === 0) return null;
            
            const flows = measurements.map(m => m.flow);
            const n = flows.length;
            const mean = flows.reduce((a, b) => a + b, 0) / n;

            let sd = 0;
            if (n > 1) {
                const variance = flows.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                sd = Math.sqrt(variance);
            }

            const cv = mean > 0 ? sd / mean : 0;
            return { mean, sd, n, cv };
        }

        function updateUI() {
            resultsTable.innerHTML = '';
            measurements.slice().reverse().forEach((m, index) => {
                const actualIndex = measurements.length - 1 - index;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${m.time.toFixed(2)}</td>
                    <td>${m.flow.toFixed(3)}</td>
                    <td style="text-align: right;">
                        <button class="delete-btn" onclick="removeMeasurement(${actualIndex})">Slet</button>
                    </td>
                `;
                resultsTable.appendChild(row);
            });

            const stats = calculateStats();
            
            if (stats) {
                meanDisplay.textContent = stats.mean.toFixed(3) + " L/s";
                sdDisplay.textContent = stats.n > 1 ? stats.sd.toFixed(4) : "0.0000";
                cvDisplay.textContent = (stats.cv * 100).toFixed(1) + "%";

                if (stats.n < 3) {
                    statusText.textContent = "Tag flere";
                    statusText.style.color = "#ffb74d";
                    reasonDisplay.textContent = `Antal målinger er utilstrækkeligt (nu: ${stats.n}).`;
                } else if (stats.cv > 0.05) {
                    statusText.textContent = "Høj variation";
                    statusText.style.color = "#ffb74d";
                    reasonDisplay.textContent = "CV er over 5%. Flere målinger anbefales.";
                } else {
                    statusText.textContent = "Lav variation";
                    statusText.style.color = "#81c784";
                    reasonDisplay.textContent = "CV er under 5% og antal målinger er tilstrækkeligt.";
                }

                const latest = measurements[measurements.length - 1];
                if (latest.time < 10) {
                    const recVolRaw = latest.flow * 10;
                    let recVolStr = "";
                    if (recVolRaw < 1) {
                        const ml = Math.ceil(recVolRaw * 10) * 100;
                        recVolStr = ml + " ml";
                    } else {
                        const l = Math.ceil(recVolRaw * 2) / 2;
                        recVolStr = l.toFixed(1) + " L";
                    }
                    guidanceText.textContent = `Tid under 10 sek. Anvend beholder på min. ${recVolStr}.`;
                    guidanceContainer.style.display = "block";
                } else {
                    guidanceContainer.style.display = "none";
                }

            } else {
                meanDisplay.textContent = "- L/s";
                sdDisplay.textContent = "-";
                cvDisplay.textContent = "-";
                statusText.textContent = "-";
                reasonDisplay.textContent = "Klar til måling";
                guidanceContainer.style.display = "none";
            }
        }

        function removeMeasurement(index) {
            measurements.splice(index, 1);
            updateUI();
        }

        function resetAll() {
            if (confirm("Nulstil alt?")) {
                measurements = [];
                timerDisplay.textContent = "0.00";
                notesArea.value = "";
                updateUI();
            }
        }
    </script>
</body>
</html>
