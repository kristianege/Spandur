<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandføringsberegner</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        input[type="number"] {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #666;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            font-variant-numeric: tabular-nums;
            margin: 10px 0;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        #actionBtn {
            background-color: #2e7d32; /* Grøn */
            color: white;
        }

        #actionBtn.running {
            background-color: #c62828; /* Rød */
        }

        .stats-box {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            border-bottom: 1px solid #444;
            padding: 8px;
            color: #a0a0a0;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #222;
        }

        .delete-btn {
            background-color: transparent;
            color: #c62828;
            border: 1px solid #c62828;
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <label for="volumeInput">Volumen på litermål (Liter)</label>
            <input type="number" id="volumeInput" step="0.1" placeholder="Fx 3.0">
        </div>

        <div class="timer-display" id="timer">0.00 s</div>
        
        <p class="error-msg" id="errorMsg">Angiv venligst volumen før start</p>

        <button id="actionBtn" onclick="toggleTimer()">Start Måling</button>

        <div class="stats-box">
            <div class="stat-row">
                <span>Gennemsnit:</span>
                <span class="stat-value" id="meanDisplay">- L/s</span>
            </div>
            <div class="stat-row">
                <span>Standardafvigelse (SD):</span>
                <span class="stat-value" id="sdDisplay">-</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tid (s)</th>
                    <th>Flow (L/s)</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                </tbody>
        </table>
    </div>

    <script>
        let startTime;
        let intervalId;
        let isRunning = false;
        let measurements = []; // Gemmer objekter: { time: number, flow: number }

        const timerDisplay = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');
        const volumeInput = document.getElementById('volumeInput');
        const resultsTable = document.getElementById('resultsTable');
        const meanDisplay = document.getElementById('meanDisplay');
        const sdDisplay = document.getElementById('sdDisplay');
        const errorMsg = document.getElementById('errorMsg');

        function toggleTimer() {
            const volume = parseFloat(volumeInput.value);

            if (!volume || volume <= 0) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            if (!isRunning) {
                // Start
                isRunning = true;
                startTime = Date.now();
                actionBtn.textContent = "Stop & Beregn";
                actionBtn.classList.add('running');
                volumeInput.disabled = true; // Lås input under måling

                intervalId = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    timerDisplay.textContent = elapsed.toFixed(2) + " s";
                }, 50);

            } else {
                // Stop
                isRunning = false;
                clearInterval(intervalId);
                actionBtn.textContent = "Start Måling";
                actionBtn.classList.remove('running');
                volumeInput.disabled = false;

                const finalTime = (Date.now() - startTime) / 1000;
                timerDisplay.textContent = finalTime.toFixed(2) + " s";
                
                addMeasurement(finalTime, volume);
            }
        }

        function addMeasurement(time, volume) {
            const flow = volume / time;
            measurements.push({ time, flow });
            updateUI();
        }

        function removeMeasurement(index) {
            measurements.splice(index, 1);
            updateUI();
        }

        function calculateStats() {
            if (measurements.length === 0) {
                return { mean: null, sd: null };
            }

            const flows = measurements.map(m => m.flow);
            const n = flows.length;
            const mean = flows.reduce((a, b) => a + b, 0) / n;

            let sd = 0;
            if (n > 1) {
                const variance = flows.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                sd = Math.sqrt(variance);
            }

            return { mean, sd };
        }

        function updateUI() {
            // Opdater tabel
            resultsTable.innerHTML = '';
            measurements.forEach((m, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${m.time.toFixed(2)}</td>
                    <td>${m.flow.toFixed(3)}</td>
                    <td style="text-align: right;">
                        <button class="delete-btn" onclick="removeMeasurement(${index})">Slet</button>
                    </td>
                `;
                resultsTable.appendChild(row);
            });

            // Opdater statistik
            const stats = calculateStats();
            
            if (stats.mean !== null) {
                meanDisplay.textContent = stats.mean.toFixed(3) + " L/s";
                sdDisplay.textContent = stats.sd !== null && measurements.length > 1 
                    ? stats.sd.toFixed(3) 
                    : (measurements.length === 1 ? "0.000" : "-");
            } else {
                meanDisplay.textContent = "- L/s";
                sdDisplay.textContent = "-";
            }
        }
    </script>
</body>
</html>
